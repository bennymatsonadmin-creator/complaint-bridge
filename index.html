    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is ComplaintBridge free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, ComplaintBridge is completely free to use. There are no hidden fees or charges for submitting a complaint."
          }
        },
        {
          "@type": "Question",
          "name": "Which companies can I complain about?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can file a complaint against any company across industries including airlines, clothing brands, retailers, voucher providers, travel companies, electronics manufacturers, delivery services, and utilities."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to get a response?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Response times vary by company and industry. Most companies respond within 7-14 business days. We recommend allowing at least 2 weeks before following up."
          }
        },
        {
          "@type": "Question",
          "name": "What is my case reference used for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your case reference (e.g., CB-2609-48213) is a unique identifier for your complaint. Keep it safe to track your complaint status and reference it in all communications."
          }
        },
        {
          "@type": "Question",
          "name": "Can I track my complaint?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, you can track your complaint using your case reference. Contact us with your reference number to check the status of your complaint."
          }
        },
        {
          "@type": "Question",
          "name": "What if I don't know the company's contact details?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "That's fine. We can help route your complaint even if you don't have the company's direct contact details. Just provide as much information as you can."
          }
        },
        {
          "@type": "Question",
          "name": "Does ComplaintBridge guarantee a refund or resolution?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, ComplaintBridge does not guarantee a refund or resolution. We are an independent platform that helps you file complaints. The outcome depends on the company's response and applicable consumer protection laws."
          }
        }
      ]
